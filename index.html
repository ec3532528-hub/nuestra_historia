<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eres Mi Historia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#141414;
    color:white;
}

header{
    position:fixed;
    width:100%;
    padding:20px 40px;
    display:flex;
    align-items:center;
    z-index:100;
    background:linear-gradient(to bottom,#000,transparent);
}

.logo{
    color:red;
    font-size:32px;
    font-weight:bold;
    margin-right:40px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-right:20px;
}

.hero{
    height:100vh;
    background:
    linear-gradient(to right,rgba(0,0,0,.9),transparent),
    url("fondo.png") center/cover;
    display:flex;
    align-items:center;
    padding:70px;
}

.overlay{
    max-width:500px;
}

.overlay h1{
    font-size:70px;
}

.overlay p{
    margin-top:15px;
    line-height:1.6;
}

.info{
    color:#46d369;
    font-weight:bold;
}

.play{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:5px;
    background:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.row{
    padding:30px;
}

.row h2{
    margin-bottom:20px;
}

.row-posters{
    display:flex;
    gap:15px;
    overflow-x:auto;
    padding-bottom:10px;
}

.row-posters::-webkit-scrollbar{
    height:8px;
}

.row-posters::-webkit-scrollbar-thumb{
    background:#555;
    border-radius:10px;
}

.poster-card{
    min-width:220px;
    cursor:pointer;
    transition:.4s;
}

.poster-card:hover{
    transform:scale(1.12);
}

.poster-card img{
    width:220px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
}

.poster-card h4{
    text-align:center;
    margin-top:8px;
}

#contenedorVideo{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:999;
}

#miVideo{
    width:75%;
    max-height:85vh;
    border-radius:10px;
}

#cerrar{
    position:absolute;
    top:20px;
    right:40px;
    font-size:35px;
    cursor:pointer;
    color:white;
}

</style>
</head>

<body>

<header>

<div class="logo">NETFLIX</div>

<nav>
<a href="#">Inicio</a>
<a href="#">Series</a>
<a href="#">Películas</a>
</nav>

</header>

<section class="hero">

<div class="overlay">

<h1>ERES MI HISTORIA</h1>

<p class="info">
98% coincidencia • 2026 • Romance
</p>

<p>
Una historia que comenzó sin planearse
y terminó convirtiéndose en mi lugar favorito.
</p>

<button class="play" onclick="verPeli()">
▶ Reproducir
</button>

</div>

</section>

<div class="row">

<h2>Nuestros Capítulos</h2>

<div class="row-posters">

<div class="poster-card" onclick="abrirVideo('nuestrahistoria.mp4')">
<img src="fondo.png" alt="">
<h4>Cómo empezó todo</h4>
</div>

<div class="poster-card" onclick="abrirVideo('video1.mp4')">
<img src="img2.png" alt="">
<h4>Nuestras aventuras</h4>
</div>

<div class="poster-card" onclick="abrirVideo('video2.mp4')">
<img src="img3.png" alt="">
<h4>Momentos felices</h4>
</div>

<div class="poster-card" onclick="abrirVideo('video3.mp4')">
<img src="img4.png" alt="">
<h4>Los recuerdos</h4>
</div>

<div class="poster-card" onclick="abrirVideo('video4.mp4')">
<img src="img5.png" alt="">
<h4>El futuro</h4>
</div>

</div>

</div>

<div id="contenedorVideo">

<span id="cerrar" onclick="cerrarVideo()">✖</span>

<video id="miVideo" controls>
</video>

</div>

<script>

function verPeli(){
    abrirVideo("nuestrahistoria.mp4");
}

function abrirVideo(videoArchivo){

    let contenedor = document.getElementById("contenedorVideo");
    let video = document.getElementById("miVideo");

    video.src = videoArchivo;

    contenedor.style.display = "flex";

    video.load();
    video.play();
}

function cerrarVideo(){

    let contenedor = document.getElementById("contenedorVideo");
    let video = document.getElementById("miVideo");

    video.pause();
    video.currentTime = 0;

    contenedor.style.display = "none";
}

window.onclick = function(event){
    let contenedor = document.getElementById("contenedorVideo");

    if(event.target == contenedor){
        cerrarVideo();
    }
}

</script>

</body>
</html>
